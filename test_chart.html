<!DOCTYPE html>
<html>
<head>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <canvas id="bookingChart"></canvas>
    <script>
        var chartData = {"labels":["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],"onlineBookings":[1050.00,1050.00,1050.00,750.00,750.00,600.00,150.00,1050.00,3150.00,0,0,0],"onSiteBookings":[600.00,600.00,150.00,300.00,450.00,300.00,450.00,750.00,900.00,0,0,0]};
        
        var ctx = document.getElementById('bookingChart').getContext('2d');
        
        var gradientOnline = ctx.createLinearGradient(0, 0, 0, 400);
        gradientOnline.addColorStop(0, 'rgba(220, 53, 69, 0.8)');
        gradientOnline.addColorStop(1, 'rgba(220, 53, 69, 0.2)');

        var gradientOnSite = ctx.createLinearGradient(0, 0, 0, 400);
        gradientOnSite.addColorStop(0, 'rgba(52, 58, 64, 0.8)');
        gradientOnSite.addColorStop(1, 'rgba(52, 58, 64, 0.2)');

        try {
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: chartData.labels,
                    datasets: [
                        {
                            label: 'Online',
                            data: chartData.onlineBookings,
                            backgroundColor: gradientOnline,
                            borderColor: '#dc3545',
                            borderWidth: 1,
                            borderRadius: 4
                        },
                        {
                            label: 'On-site',
                            data: chartData.onSiteBookings,
                            backgroundColor: gradientOnSite,
                            borderColor: '#343a40',
                            borderWidth: 1,
                            borderRadius: 4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                usePointStyle: true,
                                boxWidth: 8
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label) {
                                        label += ': ';
                                    }
                                    if (context.parsed.y !== null) {
                                        label += new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR' }).format(context.parsed.y);
                                    }
                                    return label;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: {
                                display: false
                            }
                        },
                        y: {
                            beginAtZero: true,
                            grid: {
                                borderDash: [5, 5],
                                color: '#e9ecef'
                            },
                            ticks: {
                                callback: function(value, index, values) {
                                    if (value >= 1000) {
                                        return '?' + value / 1000 + 'k';
                                    }
                                    return '?' + value;
                                }
                            }
                        }
                    }
                }
            });
            console.log("SUCCESS");
        } catch(e) {
            console.log("ERROR: " + e);
        }
    </script>
</body>
</html>
